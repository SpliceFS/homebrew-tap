name: Scripts

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scripts:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test the update script
        run: sh scripts/update-formulas-test.sh
      # ShellCheck is on the runner image. Every optional check is on.
      - name: ShellCheck
        run: shellcheck --shell=sh -o all scripts/*.sh
